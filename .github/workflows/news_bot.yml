name: Daily News Notifier

on:
  schedule:
    # Cron 時間以 UTC 為主，台灣時間 (UTC+8) 需減 8 小時
    # 每天台灣時間 07:11 (UTC 23:00 前一天) 執行
    - cron: '11 23 * * *'
  
  # 支援在 GitHub 網頁上手動按鈕觸發執行（測試用）
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 切換至專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行新聞推播腳本
        run: python app.py
