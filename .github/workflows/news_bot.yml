name: Daily News Notifier

on:
  schedule:
    # 每天台灣時間 07:11 (UTC 23:00 前一天) 執行
    - cron: '11 23 * * *'
  
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 切換至專案程式碼
        uses: actions/checkout@v4  # 從 v3 升級至 v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5  # 從 v4 升級至 v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行新聞推播腳本
        run: python app.py
